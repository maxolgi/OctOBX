# Production supervisord config for the OctOBX launcher (front.vyidd.com).
# Deploy: copy to /etc/supervisor/conf.d/octobx.conf, then
#   supervisorctl reread && supervisorctl update && supervisorctl restart octobx
#
# Runs as www-data (non-root), plain HTTP on loopback only — nginx terminates
# TLS for octobx.vyidd.com and serves the COOP/COEP headers cross-origin
# isolation needs, so the launcher itself needs no cert. dist/ is rust-embedded
# at compile time: after any ./build.sh app, rebuild gui and restart.
[program:octobx]
command=/opt/octobx/octobx_gui --no-gui --cert-mode off --host 127.0.0.1 --port 8081
directory=/opt/octobx
user=www-data
autostart=true
autorestart=true
startretries=3
stopasgroup=true
stdout_logfile=/var/log/supervisor/octobx.out.log
stderr_logfile=/var/log/supervisor/octobx.err.log
