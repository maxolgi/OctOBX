name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast checks on every push / PR.
  #    TypeScript (tsc + vitest), param-table freshness, gui lint.
  #    No emcc / WASM build here — the generated patch catalog needs only the
  #    synced .fxp files, not a synth compile.
  # ---------------------------------------------------------------------------
  check:
    name: Lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 23
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Install Linux build deps (xxd for patch generation, X11/Wayland for egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y xxd \
            libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libxkbcommon-dev libwayland-dev

      - name: npm install
        run: npm install

      # src/patch-catalog.ts is gitignored + generated; tsc fails without it.
      - name: Generate patch catalog (no emcc needed)
        run: ./build.sh catalog

      # gui/ compiles against ../dist (rust-embed embeds it at compile time).
      # The check job doesn't build the app, so stub it — contents are
      # irrelevant, only the folder's existence matters for clippy.
      - name: Stub dist/ for rust-embed
        run: mkdir -p dist && echo placeholder > dist/index.html

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vitest
        run: npm test

      - name: Param tables fresh
        run: node tools/gen-param-table.mjs --check

      # fmt is advisory (pre-existing diffs). clippy shows lints without
      # -D warnings so it doesn't error on intentional patterns.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all --manifest-path gui/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path gui/Cargo.toml --all-targets

  # ---------------------------------------------------------------------------
  # 2. Full build — ubuntu only. Both WASM modules (Emscripten), the app
  #    (vite → dist/), and the egui launcher with dist/ embedded at compile
  #    time. The Windows exe cross-compiles from Linux (x86_64-pc-windows-gnu
  #    + mingw-w64); no Windows runner needed.
  # ---------------------------------------------------------------------------
  build:
    name: Build (ubuntu-x64, windows-x64 cross)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Pin the Emscripten version the code is verified against (matches
      # the local dev toolchain) — `latest` would drift and can break the
      # build out of nowhere. Bump deliberately.
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.4
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@v5
        with:
          node-version: 23
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Install Linux build deps (xxd, mingw for the Windows exe, egui headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xxd zip mingw-w64 \
            libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libxkbcommon-dev libwayland-dev

      - name: emcc version
        run: emcc --version

      # Full chain: octopus WASM + OB-Xf synth WASM (patches.h, param tables)
      # + app (tsc + vite → dist/, incl. public/ asset copy).
      - name: Build everything (WASM + app)
        run: ./build.sh all

      # 19 behavioral checks over the built synth WASM under Node.
      - name: Synth WASM checks
        run: npm run test:wasm

      # Native gui binary for this job's ubuntu toolchain — already built by
      # ./build.sh all above, just stage + strip it. (The Debian-stable
      # binary + .deb come from the trixie container job below.)
      - name: Stage ubuntu binary
        run: |
          mkdir -p release
          cp gui/target/release/octobx_gui release/octobx_gui-ubuntu-x64
          strip release/octobx_gui-ubuntu-x64

      - name: Upload ubuntu binary
        uses: actions/upload-artifact@v7
        with:
          name: octobx_gui-ubuntu-x64
          path: release/octobx_gui-ubuntu-x64
          if-no-files-found: error

      - name: Cross-build gui launcher (Windows exe, dist embedded)
        run: cargo build --release --manifest-path gui/Cargo.toml --target x86_64-pc-windows-gnu

      # upload-artifact keeps the file's basename, so stage under the release
      # name first (octobx_gui-windows-x64.exe) to match the other assets.
      - name: Stage Windows exe
        run: cp gui/target/x86_64-pc-windows-gnu/release/octobx_gui.exe release/octobx_gui-windows-x64.exe

      - name: Upload Windows exe
        uses: actions/upload-artifact@v7
        with:
          name: octobx_gui-windows-x64
          path: release/octobx_gui-windows-x64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Debian build — trixie container, glibc 2.41.
  #    ubuntu-latest images carry a newer glibc, which would raise the binary's
  #    minimum requirement above Debian stable. Building inside debian:trixie
  #    caps it, and cargo-deb's $auto depends resolve against trixie's library
  #    versions via dpkg-shlibdeps. The whole WASM + app chain must run here
  #    too: rust-embed bakes dist/ into the binary at compile time.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build (debian-x64, trixie container)
    runs-on: ubuntu-latest
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      # Must precede checkout: git is not in the base image and checkout falls
      # back to a REST download (no submodules) without it.
      # No libssl-dev (tls feature is pure-Rust rustls), no cmake/ninja
      # (emsdk bundles its own toolchain; the gui crate has no C builds).
      - name: Install build deps (Debian trixie)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 xz-utils pkg-config \
            build-essential xxd \
            libegl-dev libgl1-mesa-dev \
            libxcb1-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev
          # sed, not `head -n 1`: head exits after the first line and ldd
          # SIGPIPEs on its remaining output (exit 141) under this job's
          # bash -o pipefail.
          ldd --version | sed -n 1p

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # dtolnay/rust-toolchain assumes rustup is preinstalled (true on GH
      # runners, not in the bare container), so install rustup directly.
      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # 6.0.4 — the emcc version the engine is verified against (same pin as
      # the setup-emsdk step in the build job above; bump both together).
      - name: Install Emscripten (emsdk 6.0.4)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.4
          "$HOME/emsdk/emsdk" activate 6.0.4
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - uses: actions/setup-node@v5
        with:
          node-version: 23
          cache: npm

      # Full chain in-container: octopus WASM + OB-Xf synth WASM + vite app +
      # the native gui build with dist/ embedded (build.sh all runs
      # npm install itself).
      - name: Build everything (WASM + app + gui)
        run: ./build.sh all

      - name: Stage binary
        run: |
          mkdir -p release
          cp gui/target/release/octobx_gui release/octobx_gui-debian-x64
          strip release/octobx_gui-debian-x64

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: octobx_gui-debian-x64
          path: release/octobx_gui-debian-x64
          if-no-files-found: error

      # .deb package (binary already built, --no-build skips rebuild). $auto
      # depends resolve against trixie via dpkg-shlibdeps (from
      # build-essential); metadata lives in gui/Cargo.toml
      # ([package.metadata.deb]).
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        run: cargo deb --no-build --manifest-path gui/Cargo.toml

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: octobx-deb
          path: gui/target/debian/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Publish a GitHub Release for every successful build.
  #    - Push to main  → regular release tagged dev-<short_sha>, marked
  #      "latest" (prerelease=false — GitHub ignores make_latest on
  #      pre-releases, so dev builds must be full releases to get the
  #      "Latest" badge, top-of-list pinning, sidebar visibility, and a
  #      working /releases/latest link)
  #    - v* tag push    → stable release tagged <version>, marked "latest"
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build, build-linux]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No name → downloads every artifact of this run, each into its own
      # artifacts/<name>/ subdirectory.
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          ls -R artifacts
          # Copy by filename from anywhere in the tree — layout-proof either
          # way. Expect exactly 4 assets: windows exe + ubuntu binary +
          # debian binary (trixie) + .deb.
          mkdir -p release
          find artifacts -type f \( -name 'octobx_gui-*' -o -name '*.deb' \) -exec cp {} release/ \;
          ls -la release
          [ "$(find release -type f | wc -l)" -eq 4 ] || { echo "ERROR: expected 4 release assets"; exit 1; }

      - name: Set release metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          short="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}"    >> "$GITHUB_OUTPUT"
            echo "name=${REF#refs/tags/}"   >> "$GITHUB_OUTPUT"
            echo "prerelease=false"         >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}"         >> "$GITHUB_OUTPUT"
            echo "name=Dev ${short}"        >> "$GITHUB_OUTPUT"
            echo "prerelease=false"         >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
