<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OctOBX — Octopus + OB-XD in your browser</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --panel: #2a2a2a;
            --border: #3a3a3a;
            --accent: #0c0;
            --text: #e0e0e0;
            --text-dim: #888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            overflow-y: auto;
            scrollbar-width: none;        /* Firefox */
            -ms-overflow-style: none;     /* old IE/Edge */
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;                /* Chrome/Safari */
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: monospace;
            font-size: 13px;
            min-height: 100vh;
        }
        /* Page wrapper — clears the fixed transport bar on desktop;
           on touch devices the bar is toggle-hidden so no top padding. */
        .app-main {
            padding-top: 48px;
            min-height: calc(100vh - 48px);
        }
        @media (hover: none) and (pointer: coarse) {
            .app-main { padding-top: 0; }
        }
        /* classic-panel.ts sets view-classic's class to .octo-classic-root,
           which is position:fixed;inset:0 — the Octopus panel would fill the
           viewport and overlay the in-flow synth panel. This ID-based
           override (higher specificity than the runtime-injected class rule)
           keeps the Octopus panel participating in document flow so the synth
           panel can sit naturally below it. min-height preserves the
           "panel fills the visible area when no synth is shown" visual. */
        #view-classic {
            position: relative;
            inset: auto;
            min-height: calc(100vh - 48px);
        }
        @media (hover: none) and (pointer: coarse) {
            #view-classic { min-height: 100vh; }
        }
        .transport-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(42, 42, 42, 0.92);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
            flex-wrap: wrap;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
        }
        .transport-bar button {
            background: #333;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 16px;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
        }
        .transport-bar button:hover { background: #444; }
        .transport-bar button:active { background: #222; }
        #oct-tempo {
            background: #1a1a1a;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 4px 8px;
            font-family: monospace;
            width: 60px;
            text-align: center;
            border-radius: 3px;
        }
        #oct-transport-indicator {
            padding: 4px 12px;
            font-weight: bold;
            border-radius: 3px;
        }
        .transport-playing { background: #1a3a1a; color: #0f0; }
        .transport-stopped { background: #3a1a1a; color: #f00; }
        #oct-midi-output, #oct-midi-input {
            background: #1a1a1a;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 4px 8px;
            font-family: monospace;
            border-radius: 3px;
        }
        #oct-midi-rescan {
            background: #333;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 4px 8px;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
        }
        #oct-midi-rescan:hover { background: #444; }
        #octopus-grid {
            padding: 16px;
        }
        .grid-section {
            margin-bottom: 16px;
        }
        .grid-section-label {
            color: var(--text-dim);
            font-size: 10px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .step-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 3px;
            max-width: 900px;
        }
        .pad-cell {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: transparent;
            flex-shrink: 0;
        }
        .pad-btn {
            width: 100%;
            height: 32px;
            background: #333;
            border: 1px solid #444;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            color: #666;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pad-btn:hover { background: #3a3a3a; }
        .pad-btn.held { border-color: var(--accent); }
        .mix-strip {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 3px;
            max-width: 900px;
            margin-bottom: 8px;
        }
        .mix-btn {
            height: 28px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mix-btn:hover { background: #333; }
        .control-strip {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            max-width: 900px;
        }
        .ctrl-btn {
            min-width: 48px;
            height: 28px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover { background: #333; }
        .rotary-group {
            display: flex;
            gap: 3px;
        }
        .rotary {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 2px solid #3a3a3a;
            cursor: ns-resize;
            font-size: 8px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rotary:hover { border-color: #555; }

        /* ---- OB-XD synth panel (Phase 4/5) ---- */
        .obxd-panel {
            background: rgba(20, 20, 20, 0.95);
            padding: 8px 12px 12px;
            z-index: 999;
        }
        .obxd-panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .obxd-panel-header > span:first-child {
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent);
            font-size: 12px;
        }
        /* Instance selector + per-instance controls in the panel header.
           Match the transport-bar select styling so the whole panel reads
           as part of the same UI. */
        #obxd-instance-selector {
            background: #1a1a1a;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 4px 8px;
            font-family: monospace;
            font-size: 11px;
            border-radius: 3px;
            min-width: 170px;
        }
        #obxd-instance-polyphony,
        #obxd-instance-channel {
            background: #1a1a1a;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 3px 6px;
            font-family: monospace;
            font-size: 11px;
            border-radius: 3px;
        }
        .obxd-header-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Per-instance power button — green when on (matches the knob
           accent), subdued when off. */
        #obxd-instance-power {
            background: #333;
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 5px 12px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            min-width: 44px;
        }
        #obxd-instance-power:hover { background: #444; }
        #obxd-instance-power.synth-on {
            background: #1a3a1a;
            color: var(--accent);
            border-color: var(--accent);
        }
        /* Per-instance RMS meter. Inner bar width is driven by JS at
           30Hz from pong `meters[selectedInstance]`. Gradient gives a
           quick visual cue from green (quiet) to red (loud). */
        #obxd-instance-meter.obxd-meter {
            width: 80px;
            height: 6px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 2px;
            overflow: hidden;
            flex: 0 0 auto;
        }
        #obxd-instance-meter .obxd-meter-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #0c0, #cc0, #f00);
            transition: width 50ms linear;
        }
        #obxd-patch-name {
            color: var(--text);
            font-size: 11px;
            background: var(--panel);
            padding: 4px 10px;
            border-radius: 3px;
            border: 1px solid var(--border);
            flex: 1 1 auto;
            min-width: 100px;
            max-width: 320px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .obxd-file-btn {
            display: inline-block;
            background: #333;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 5px 12px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
        }
        .obxd-file-btn:hover { background: #444; }
        #obxd-reset-btn, #obxd-panic-btn, #obxd-panic-all-btn {
            background: #333;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 5px 12px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
        }
        #obxd-reset-btn:hover { background: #444; }
        #obxd-panic-btn, #obxd-panic-all-btn { color: #f55; border-color: #533; }
        #obxd-panic-btn:hover, #obxd-panic-all-btn:hover { background: #422; }

        .obxd-knob-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-start;
        }
        .obxd-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 8px 8px;
        }
        .obxd-section-label {
            color: var(--text-dim);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 3px;
            margin-bottom: 2px;
        }
        .obxd-section-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            max-width: 100%;
        }
        .obxd-knob {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 44px;
            user-select: none;
            cursor: ns-resize;
            outline: none;
        }
        .obxd-knob:focus-visible {
            background: rgba(0, 204, 0, 0.08);
            border-radius: 3px;
        }
        .obxd-knob.dragging svg circle:first-of-type,
        .obxd-knob.dragging svg path:first-of-type {
            stroke-width: 4;
        }
        .obxd-knob-label {
            font-size: 8px;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            text-align: center;
            margin-top: 2px;
            font-family: monospace;
            white-space: nowrap;
        }
        .obxd-knob-value {
            font-size: 8px;
            color: var(--text);
            text-align: center;
            font-family: monospace;
            min-height: 10px;
        }
        .obxd-toggle {
            width: 44px;
            min-height: 22px;
            padding: 4px 2px;
            font-family: monospace;
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-dim);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 3px;
            cursor: pointer;
            align-self: flex-end;
        }
        .obxd-toggle:hover { background: #333; }
        .obxd-toggle-on {
            background: #1a3a1a;
            color: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>
<body>

<div class="transport-bar">
    <button id="oct-play">PLAY</button>
    <button id="oct-stop">STOP</button>
    <button id="oct-save">SAVE</button>
    <button id="oct-load">LOAD</button>
    <span>BPM:</span>
    <input id="oct-tempo" type="number" min="10" max="199" value="120">
    <span id="oct-transport-indicator" class="transport-stopped">STOPPED</span>
    <span>MIDI Out:</span>
    <select id="oct-midi-output"><option value="">None</option></select>
    <span>MIDI In:</span>
    <select id="oct-midi-input"><option value="">None</option></select>
    <button id="oct-midi-rescan" title="Re-scan MIDI ports">↻ Rescan</button>
    <span style="margin-left:auto">View:</span>
    <select id="view-toggle">
        <option value="classic">Classic (full panel)</option>
        <option value="modern">Modern (grid)</option>
    </select>
</div>

<main class="app-main">
    <div id="view-classic"></div>
    <div id="view-modern" style="display:none"></div>

    <div id="obxd-panel" class="obxd-panel">
        <div class="obxd-panel-header">
            <span>OB-XD</span>
            <select id="obxd-instance-selector">
                <option value="0">Instance 1 — Analog Pad</option>
                <option value="1">Instance 2 — Bass Pulse</option>
                <option value="2">Instance 3 — Lead Saw</option>
                <option value="3">Instance 4 — Pluck</option>
                <option value="4">Instance 5 — Strings</option>
                <option value="5">Instance 6 — Keys</option>
                <option value="6">Instance 7 — Drone</option>
                <option value="7">Instance 8 — Stab</option>
                <option value="8">Instance 9 — Noise Hat</option>
                <option value="9">Instance 10 — Kick</option>
            </select>
            <button id="obxd-instance-power" aria-pressed="true">On</button>
            <label class="obxd-header-label">Voices:
                <select id="obxd-instance-polyphony">
                    <option value="1">1 (mono)</option>
                    <option value="2">2</option>
                    <option value="4">4</option>
                    <option value="8">8</option>
                </select>
            </label>
            <label class="obxd-header-label">MIDI Ch:
                <select id="obxd-instance-channel">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                </select>
            </label>
            <div id="obxd-instance-meter" class="obxd-meter">
                <div class="obxd-meter-bar"></div>
            </div>
            <span id="obxd-patch-name">— Analog Pad —</span>
            <label class="obxd-file-btn">Load .fxp
                <input id="obxd-fxp-input" type="file" accept=".fxp,.fxb" hidden>
            </label>
            <button id="obxd-reset-btn" type="button">Reset</button>
            <button id="obxd-panic-btn" type="button">Panic</button>
            <button id="obxd-panic-all-btn" type="button">Panic All</button>
        </div>
        <div id="obxd-knob-grid" class="obxd-knob-grid"></div>
    </div>
</main>

<script type="module" src="/src/main.ts"></script>
<script>
// Generate the Octopus grid UI elements
(function generateGrid() {
    const container = document.getElementById("view-modern");

    // Mix strip
    const mixNames = ["MIX","SEL","ATR","VOL","PAN","MOD","EXP","U0","U1","U2","U3","U4","U5","MUT","EDT","ESC"];
    const mixKeys = [21,32,43,54,65,76,87,98,109,120,131,142,153,164,175,186];
    const mixDiv = document.createElement("div");
    mixDiv.className = "grid-section";
    mixDiv.innerHTML = '<div class="grid-section-label">Mix Strip</div>';
    const mixStrip = document.createElement("div");
    mixStrip.className = "mix-strip";
    mixNames.forEach((name, i) => {
        const cell = document.createElement("div");
        cell.className = "pad-cell";
        const led = document.createElement("div");
        led.className = "led";
        const btn = document.createElement("button");
        btn.className = "mix-btn";
        btn.textContent = name;
        btn.id = `mx${mixKeys[i]}`;
        btn.dataset.key = mixKeys[i];
        cell.appendChild(led);
        cell.appendChild(btn);
        mixStrip.appendChild(cell);
    });
    mixDiv.appendChild(mixStrip);
    container.appendChild(mixDiv);

    // Step pads: 10 rows × 16 columns
    const stepDiv = document.createElement("div");
    stepDiv.className = "grid-section";
    stepDiv.innerHTML = '<div class="grid-section-label">Step Grid (10 tracks × 16 steps)</div>';
    const stepGrid = document.createElement("div");
    stepGrid.className = "step-grid";
    for (let row = 0; row < 10; row++) {
        for (let col = 0; col < 16; col++) {
            const key = row * 16 + col;
            const cell = document.createElement("div");
            cell.className = "pad-cell";
            const led = document.createElement("div");
            led.className = "led";
            const btn = document.createElement("button");
            btn.className = "pad-btn";
            btn.textContent = `${row + 1}.${col + 1}`;
            btn.id = `p${row}_${col}`;
            btn.dataset.step = key;
            cell.appendChild(led);
            cell.appendChild(btn);
            stepGrid.appendChild(cell);
        }
    }
    stepDiv.appendChild(stepGrid);
    container.appendChild(stepDiv);

    // Transport keys
    const transportDiv = document.createElement("div");
    transportDiv.className = "grid-section";
    transportDiv.innerHTML = '<div class="grid-section-label">Transport</div>';
    const transportStrip = document.createElement("div");
    transportStrip.className = "control-strip";
    const tkeys = [
        ["REC",223],["STP",231],["PSE",232],["P1",241],["P2",240],["P4",250],
        ["GRID",218],["PAGE",219],["TRK",220],["STEP",227],["MAP",228],["PLAY",229],
        ["PGM",242],["TPO",234],
    ];
    tkeys.forEach(([name, key]) => {
        const cell = document.createElement("div");
        cell.className = "pad-cell";
        cell.style.flex = "0 0 auto";
        const led = document.createElement("div");
        led.className = "led";
        const btn = document.createElement("button");
        btn.className = "ctrl-btn";
        btn.textContent = name;
        btn.dataset.key = key;
        cell.appendChild(led);
        cell.appendChild(btn);
        transportStrip.appendChild(cell);
    });
    transportDiv.appendChild(transportStrip);
    container.appendChild(transportDiv);

    // Rotary encoders
    const rotaryDiv = document.createElement("div");
    rotaryDiv.className = "grid-section";
    rotaryDiv.innerHTML = '<div class="grid-section-label">Rotary Encoders (scroll to turn)</div>';
    const rotaryGroup = document.createElement("div");
    rotaryGroup.className = "rotary-group";
    const rotNames = ["TPO","VEL","PIT","LEN","STA","POS","DIR","AMT","GRV","MCC","MCH"];
    rotNames.forEach((name, i) => {
        const rot = document.createElement("div");
        rot.className = "rotary";
        rot.textContent = name;
        rot.dataset.rotary = i;
        rotaryGroup.appendChild(rot);
    });
    rotaryDiv.appendChild(rotaryGroup);
    container.appendChild(rotaryDiv);
})();
</script>

</body>
</html>
